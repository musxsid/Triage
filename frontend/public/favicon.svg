      <stop offset="0%" stop-color="#FF8A5C"/>
      <stop offset="50%" stop-color="#E8784A"/>
      <stop offset="100%" stop-color="#D4602C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#E8784A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Tile -->
