<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Rich Vibrant Warm Sunset Coral -->
    <linearGradient id="triageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A45"/>
      <stop offset="45%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2390A"/>
    </linearGradient>

    <!-- Wing Gradients with Specular Sheen -->
    <linearGradient id="leftWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFE7DB" stop-opacity="0.80"/>
    </linearGradient>

    <linearGradient id="rightWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1.0"/>
      <stop offset="100%" stop-color="#FFDAC4" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FFF3EB"/>
      <stop offset="100%" stop-color="#FFE2D1"/>
    </linearGradient>

    <!-- Outer Ambient Glow Filter -->
    <filter id="triageGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#EA580C" flood-opacity="0.4"/>
    </filter>

    <!-- Symbol Inner Drop Shadow -->
    <filter id="symbolShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#7A1D03" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Squircle with Glow -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#triageBg)" filter="url(#triageGlow)"/>

  <!-- Subtle Specular Highlight Rim (Liquid Glass Bevel) -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="15.5" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Triage 3-Piece Faceted Emblem (forms iconic 'T' + priority arrow) -->
  <g filter="url(#symbolShadow)">
    <!-- Facet 1: Left Wing of Triage T -->
    <path d="M 15 17 C 15 15.6 16 15 17.5 15 H 29.5 C 30.5 15 31 15.7 31 16.7 V 24.3 C 31 25.3 30.5 26 29.5 26 H 17.5 C 16 26 15 25.1 15 23.8 Z" 
          fill="url(#leftWingGrad)" />

    <!-- Facet 2: Right Wing of Triage T -->
    <path d="M 33 16.7 C 33 15.7 33.5 15 34.5 15 H 46.5 C 48 15 49 15.6 49 17 V 23.8 C 49 25.1 48 26 46.5 26 H 34.5 C 33.5 26 33 25.3 33 24.3 Z" 
          fill="url(#rightWingGrad)" />

    <!-- Facet 3: Center Pillar with Priority Arrow Anchor -->
    <path d="M 27 28.5 C 27 27.7 27.7 27 28.5 27 H 35.5 C 36.3 27 37 27.7 37 28.5 V 41.5 L 32 47.5 L 27 41.5 Z" 
          fill="url(#pillarGrad)" />
  </g>

  <!-- Accent Focus Jewel (Top Right subtle priority beacon) -->
  <circle cx="47.5" cy="16.5" r="1.5" fill="#FFFFFF" opacity="0.9"/>
</svg>