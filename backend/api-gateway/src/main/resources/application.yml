server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            exposedHeaders:
              - "Set-Cookie"

      routes:
        - id: note-service-route
          uri: ${NOTE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/notes/**, /api/workspaces/**, /api/folders/**

        - id: ai-service-route
          uri: ${AI_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/ai/**

        - id: upload-service-route
          uri: ${UPLOAD_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/upload/**, /uploads/**

        - id: search-service-route
          uri: ${SEARCH_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/search/**

keycloak:
  auth-server-url: ${KEYCLOAK_URL:http://localhost:8081}
  realm: simplynotes
  client-id: simplynotes-app
